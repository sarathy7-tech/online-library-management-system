<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Pay Fine</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow">
                    <div class="card-body p-4 text-center">
                        <h3 class="mb-3">Pay Fine</h3>
                        <p class="fs-4">Amount: <strong class="text-danger">₹{{ fine.amount }}</strong></p>
                        <p class="text-muted">Fine Date: {{ fine.fine_date }}</p>

                        <form method="POST">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-success w-100">Confirm Payment</button>
                            <a href="{% url 'circulation:my_books' %}" class="btn btn-secondary w-100 mt-2">Cancel</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
