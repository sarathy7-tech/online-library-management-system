<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Upload Digital Resource</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body p-4">
                        <h3 class="mb-3">Upload PDF / Journal</h3>
                        <p class="text-muted">Book: <strong>{{ book.title }}</strong></p>

                        <form method="POST" enctype="multipart/form-data">
                            {% csrf_token %}

                            <div class="mb-3">
                                <label class="form-label">Select File (PDF, EPUB, etc.) *</label>
                                <input type="file" name="file" class="form-control" accept=".pdf,.epub,.doc,.docx" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">File Type</label>
                                <select name="file_type" class="form-select">
                                <option value="pdf">PDF</option>
                                <option value="epub">EPUB</option>
                                <option value="journal">Journal</option>
                                <option value="other">Other</option>
                            </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Access Level</label>
                                <select name="access_level" class="form-select">
                                <option value="Member">Members Only</option>
                                <option value="Public">Public</option>
                            </select>
                            </div>

                            <button type="submit" class="btn btn-primary w-100">Upload</button>
                            <a href="{% url 'books:manage_digital' book.id %}" class="btn btn-secondary w-100 mt-2">Cancel</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
