<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Manage Publishers</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'staff_dashboard' %}">← Staff Dashboard</a>
            <a href="{% url 'books:add_publisher' %}" class="btn btn-success btn-sm">
                <i class="bi bi-plus-circle"></i> Add Publisher
            </a>
        </div>
    </nav>

    <div class="container mt-4">
        <h3 class="mb-4">Manage Publishers</h3>
        <div class="card shadow-sm">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Publisher Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for publisher in publishers %}
                        <tr>
                            <td>{{ publisher.publisher_name }}</td>
                            <td>{{ publisher.email|default:"-" }}</td>
                            <td>{{ publisher.phone|default:"-" }}</td>
                            <td>
                                <a href="{% url 'books:edit_publisher' publisher.id %}" class="btn btn-sm btn-warning">Edit</a>
                                <a href="{% url 'books:delete_publisher' publisher.id %}" class="btn btn-sm btn-danger">Delete</a>
                            </td>
                        </tr>
                        {% empty %}
                        <tr>
                            <td colspan="4" class="text-center text-muted">No publishers found.</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>

</html>
