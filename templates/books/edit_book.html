<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Edit Book</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-body p-4">
                        <h3 class="mb-4">Edit Book</h3>
                        <form method="POST" enctype="multipart/form-data">
                            {% csrf_token %}

                            <div class="mb-3">
                                <label class="form-label">Title *</label>
                                <input type="text" name="title" class="form-control" value="{{ book.title }}" required>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">ISBN</label>
                                    <input type="text" name="isbn" class="form-control" value="{{ book.isbn }}">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Language</label>
                                    <input type="text" name="language" class="form-control" value="{{ book.language }}">
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Author</label>
                                    <select name="author" class="form-select">
                                    <option value="">Select Author</option>
                                    {% for author in authors %}
                                        <option value="{{ author.id }}" {% if book.author_id == author.id %}selected{% endif %}>
                                            {{ author.author_name }}
                                        </option>
                                    {% endfor %}
                                </select>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Category</label>
                                    <select name="category" class="form-select">
                                    <option value="">Select Category</option>
                                    {% for cat in categories %}
                                        <option value="{{ cat.id }}" {% if book.category_id == cat.id %}selected{% endif %}>
                                            {{ cat.category_name }}
                                        </option>
                                    {% endfor %}
                                </select>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Publisher</label>
                                    <select name="publisher" class="form-select">
                                    <option value="">Select Publisher</option>
                                    {% for pub in publishers %}
                                        <option value="{{ pub.id }}" {% if book.publisher_id == pub.id %}selected{% endif %}>
                                            {{ pub.publisher_name }}
                                        </option>
                                    {% endfor %}
                                </select>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Publication Year</label>
                                <input type="number" name="publication_year" class="form-control" value="{{ book.publication_year }}">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Summary</label>
                                <textarea name="summary" class="form-control" rows="3">{{ book.summary }}</textarea>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Book Cover</label> {% if book.cover_image %}
                                <p>Current: <img src="{{ book.cover_image.url }}" height="60" class="ms-2"></p>
                                {% endif %}
                                <input type="file" name="cover_image" class="form-control" accept="image/*">
                            </div>

                            <button type="submit" class="btn btn-primary w-100">Update Book</button>
                            <a href="{% url 'books:manage_books' %}" class="btn btn-secondary w-100 mt-2">Cancel</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
